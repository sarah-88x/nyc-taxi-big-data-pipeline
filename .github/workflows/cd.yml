name: Data Pipeline CD

on:
  push:
    branches: [ main ]

jobs:
  deploy-to-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deploy Scripts to Production Server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        source: "airflow/dags/,spark/,docker/docker-compose.yml"
        target: "/opt/nyc-taxi-pipeline/"

    - name: Restart Pipeline Services via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /opt/nyc-taxi-pipeline/docker
          docker compose down
          docker compose up -d